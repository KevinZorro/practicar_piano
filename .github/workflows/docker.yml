name: docker-arm64
# Builds the image for linux/arm64 (the VPS architecture) on a native arm64 runner and smoke-tests it.
# QEMU emulation took ~22 min per run; the native runner is free for public repositories.
on:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/.dockerignore
      - backend/pyproject.toml
      - backend/uv.lock
      - backend/src/**
      - backend/scripts/**
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          load: true
          push: false
          tags: teclario-phase0:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (arm64)
        run: |
          docker run --rm --platform linux/arm64 --entrypoint uname teclario-phase0:ci -m
          docker run --rm --platform linux/arm64 --entrypoint deno teclario-phase0:ci --version
          docker run --rm --platform linux/arm64 --entrypoint ffmpeg teclario-phase0:ci -version
          docker run --rm --platform linux/arm64 teclario-phase0:ci phase0 --help
          docker run --rm --platform linux/arm64 --entrypoint python teclario-phase0:ci \
            -c "import onnxruntime, torch, pretty_midi, piano_transcription_inference; print('imports ok')"
