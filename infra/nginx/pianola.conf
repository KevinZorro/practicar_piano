# Nginx for Pianola. Replace pianola.example.duckdns.org with your domain, put it in
# /etc/nginx/sites-available/pianola and run certbot (docs/phase-1/despliegue-vps.md).
#
# The frontend is static (frontend/dist); /api goes to the container on 127.0.0.1:8000.

limit_req_zone $binary_remote_addr zone=pianola_api:10m rate=10r/s;

server {
    listen 80;
    server_name pianola.example.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pianola.example.duckdns.org;

    # certbot fills these in.
    ssl_certificate     /etc/letsencrypt/live/pianola.example.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pianola.example.duckdns.org/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # YouTube's player is the only third-party frame; Tone.js and OSMD are bundled.
    add_header Content-Security-Policy "default-src 'self'; frame-src https://www.youtube.com; script-src 'self' https://www.youtube.com https://s.ytimg.com; img-src 'self' data: https://i.ytimg.com; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:" always;

    root /var/www/pianola;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        limit_req zone=pianola_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        # Server-sent events: no buffering, and a long read timeout (heartbeat every 15 s).
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # Results carry the score XML: a few MB is plenty, and links are tiny.
    client_max_body_size 8k;
}
