# Default rules plus a path-independent allowlist for known false positives:
# localStorage key names like `<app>.pendingJobs.v1` and `<app>.prefs.v1` look like generic API keys.
[extend]
useDefault = true

[allowlist]
description = "localStorage key names are not secrets"
regexes = ['''^[a-z]+\.(pendingJobs|prefs)\.v1$''']
